name: Advisories

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-floors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Fails the run: an advisory on a declared peer floor means consumers can
      # install a vulnerable version that this library says it supports.
      - run: node .github/scripts/peer-floor-advisories.mjs

  workspace-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Informational only: the workspace's own production tree (demo, docs
      # site) carries advisories that do not ship in the published package.
      - name: pnpm audit --prod (report only)
        run: |
          {
            echo '## pnpm audit --prod --audit-level high'
            echo '```'
            pnpm audit --prod --audit-level high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
