name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Only a superseded pull-request run is cancelled. Every push to main gets its own group:
  # the change detection diffs each push against the commit before it, so cancelling a run
  # would drop that push's changes from the mutation report for good.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides what the slow jobs below need to do for this change: it diffs against the pull
  # request's base branch, or against the commit before a push to main. A base it cannot
  # diff (a new branch, a commit missing from the clone after a force push) gets the full answer.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      library: ${{ steps.decide.outputs.library }}
      mutate: ${{ steps.decide.outputs.mutate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff against the base: a pull request's base branch or a push's previous commit

      # The script needs Node >= 24.8 (`import.meta.main` from 24.2, `path.matchesGlob` stable from 24.8); the runner's
      # preinstalled Node is not guaranteed to have either, so use the repository's pinned one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - id: decide
        env:
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node .github/scripts/ci-changes.mjs "$BASE"

  # Lints the workflow files themselves (expressions, `if:` conditions, job
  # wiring and, through the runner's shellcheck, the `run:` scripts).
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint 1.7.12 (checksum-verified)
        run: |
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint

      - run: ./actionlint -color

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify:ci

  mutation:
    # Minutes-slow and report-only. It runs on pull requests and on pushes to main: the
    # repository is developed by direct pushes, so a pull-request-only rule left most
    # library changes without a mutation report. It mutates only the library files the
    # change touched (see .github/scripts/ci-changes.mjs) and skips entirely when there
    # are none.
    needs: changes
    if: needs.changes.outputs.mutate != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Stryker
        env:
          MUTATE: ${{ needs.changes.outputs.mutate }}
        run: |
          if [ "$MUTATE" = full ]; then
            pnpm test:mutation
          else
            echo "Mutating only the changed files: $MUTATE"
            pnpm test:mutation --mutate "$MUTATE"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/
          retention-days: 14

  convex-peer-range:
    # Skipped for pull requests that cannot affect the library (docs, demo-only, ...);
    # always runs on pushes to main.
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        convex: ['1.42.1', '^1']
    # '1.42.1' is the declared peer floor; '^1' resolves to the newest 1.x that
    # has cleared the workspace's minimumReleaseAge cooldown (pnpm picks the
    # highest mature version in a range), i.e. the newest release inside the
    # peer cap. A red leg is an early warning, not a merge gate: the required
    # check is `verify`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm add -w convex@${{ matrix.convex }}

      - run: pnpm exec nx test convex-angular --skip-nx-cache

      - run: pnpm typecheck && pnpm typecheck:spec
