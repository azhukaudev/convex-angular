name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx affected/graph and knip see full history

      - uses: pnpm/action-setup@v4 # reads the version from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify:ci

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx affected/graph and knip see full history

      - uses: pnpm/action-setup@v4 # reads the version from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:mutation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/
          retention-days: 14

  convex-peer-range:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        convex: ['1.42.1', '^1']
    # '1.42.1' is the declared peer floor; '^1' resolves to the newest 1.x that
    # has cleared the workspace's minimumReleaseAge cooldown (pnpm picks the
    # highest mature version in a range), i.e. the newest release inside the
    # peer cap. A red leg is an early warning, not a merge gate: the required
    # check is `verify`.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the version from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm add -w convex@${{ matrix.convex }}

      - run: pnpm exec nx test convex-angular --skip-nx-cache

      - run: pnpm typecheck && pnpm typecheck:spec
