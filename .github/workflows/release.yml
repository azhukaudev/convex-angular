name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # rehearsal: verify, build and `npm publish --dry-run`; never publishes

# Read-only by default. The only job that needs `id-token: write` (publish)
# declares it itself, so nothing that installs or builds the workspace can mint
# an OIDC token.
permissions:
  contents: read

jobs:
  # Everything that executes workspace code (install scripts, the full gate, the
  # library build). No secrets, no id-token, no environment.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A guard against mistakes, not a security boundary (anyone who can push a
      # tag can also edit this file at that tag): a tag on an unreviewed or
      # un-CI'd commit fails here instead of being published with provenance.
      # The enforcing controls are the repository settings in RELEASING.md §9.
      - name: Check tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main — refusing to publish"
            exit 1
          }

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The "Check tagged commit is on main" step guarantees main contains this commit; CI runs on every push to main.
      # Re-run the deterministic gate only.
      - run: pnpm verify:ci

      - run: pnpm build:library
      # ng-packagr copies only a LICENSE that sits in the package directory
      # (packages/convex-angular/LICENSE, a copy of the root file). `cmp` fails
      # when the built package has none, or when the copy has drifted.
      - name: Check the built package ships the LICENSE
        run: cmp LICENSE dist/packages/convex-angular/LICENSE

      # The tag must match the built manifest — a mis-tagged release fails here
      # instead of publishing the wrong version.
      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./dist/packages/convex-angular/package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package $PKG"; exit 1; }

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish dist/packages/convex-angular --dry-run

      # include-hidden-files: dist/ ships a `.npmignore` (the nested entry-point package.json files) that
      # decides what npm packs; without it the publish job would publish more
      # than the dry run above showed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: convex-angular-dist
          path: dist/packages/convex-angular
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Publishes the package directory verify built. Nothing from the workspace is
  # installed or executed here: npm publish needs only Node, npm and the directory.
  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewers, the deployment-tag restriction and the NPM_TOKEN secret
    # live on this environment (repository settings; see RELEASING.md §9).
    environment: Production
    permissions:
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.verify.outputs.node-version }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: convex-angular-dist
          path: dist/packages/convex-angular

      - name: Publish
        run: npm publish dist/packages/convex-angular --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
