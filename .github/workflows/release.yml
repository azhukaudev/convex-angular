name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry-run rehearsal: runs everything except the publish

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers and the NPM_TOKEN secret live on this environment
    # (repository settings; see RELEASING.md "Auth").
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Publish only commits that are on main: a tag on an unreviewed or
      # un-CI'd commit fails here instead of being published with provenance.
      - name: Check tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main — refusing to publish"
            exit 1
          }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Step "Check tagged commit is on main" guarantees main contains this commit; CI runs on every push to main.
      # Re-run the deterministic gate only.
      - run: pnpm verify:ci

      - run: pnpm build:library

      # The tag must match the built manifest — a mis-tagged release fails here
      # instead of publishing the wrong version.
      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./dist/packages/convex-angular/package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package $PKG"; exit 1; }

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish dist/packages/convex-angular --dry-run

      - name: Publish
        if: github.event_name == 'push'
        run: npm publish dist/packages/convex-angular --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
