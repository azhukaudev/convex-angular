# Keeps the commit-SHA pins in .github/workflows current. npm dependencies are
# updated by hand on purpose (strict pnpm release-age cooldown, grouped bumps).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let a new action release age before proposing it, like pnpm's own cooldown.
    cooldown:
      default-days: 7
    groups:
      # Minor and patch bumps share one pull request; a major bump arrives on its own so it
      # can be reviewed (f68f76d landed six majors in one grouped PR).
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
