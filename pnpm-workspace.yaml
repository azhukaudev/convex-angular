# Force a single @better-fetch/fetch copy. better-auth pins 1.3.3 exactly while
# @convex-dev/better-auth resolves ^1.3.3 independently; two copies produce
# incompatible BetterFetch type identities and break the better-auth client
# plugin types (crossDomainClient/convexClient) during the Angular build.
# The docs site owns its own manifest so Astro's toolchain (Vite 8) resolves
# independently of the Angular build (which pins Vite exactly through
# @angular/build). The root manifest stays the workspace root; overrides,
# allowBuilds, and release-age settings below remain workspace-wide.
packages:
  - apps/docs
overrides:
  '@better-fetch/fetch': 1.3.3
  # @nx/js declares verdaccio as an optional peer (for its removed-from-this-repo local-registry
  # executor); autoInstallPeers installs it anyway and drags in handlebars/js-yaml/compression
  # advisories. The workspace no longer uses Verdaccio, so remove it from @nx/js's graph.
  # Remove when @nx/js no longer declares verdaccio as a peer (check its package.json peerDependencies).
  '@nx/js>verdaccio': '-'
  # nx@23.3.1 pins undici 7.29.0 exactly (advisories fixed in 7.30.1; nx@24.0.4 pins 7.30.1).
  # Remove when Nx >= 24.0.4. Do not raise past 7.30.1 without checking minimumReleaseAge.
  'nx>undici': 7.30.1
  # unstorage (through astro) declares @vercel/functions as an optional peer for its Vercel cache driver;
  # autoInstallPeers installs it anyway. The docs site runs on Cloudflare and never loads that driver.
  # Remove when unstorage no longer declares the peer (check its package.json peerDependencies).
  'unstorage>@vercel/functions': '-'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  less: false
  lmdb: true
  msgpackr-extract: true
  nx: true
  # Astro declares sharp as an optional dependency for image optimization.
  # The docs site configures Astro's passthrough image service instead, so
  # sharp is never loaded and its native install script stays denied.
  sharp: false
  unrs-resolver: true
  # Wrangler (docs deploy) runs on workerd; its install script checks for the platform binary.
  workerd: true
# Release-age cooldown. pnpm will not install a version published in the last 1440 minutes, one
# day, without approval. Strict mode is set explicitly. Without it, pnpm installs a too-new
# version anyway and quietly adds it to minimumReleaseAgeExclude, which protects nothing. With it,
# an interactive install asks for approval and CI fails with NO_MATURE_MATCHING_VERSION.
# For a same-day security bump, approve at the prompt or add the exact version by hand, for example
#   minimumReleaseAgeExclude:
#     - '@angular/router@21.2.25'
# Remove the entry once the version is a day old, because every entry turns off the cooldown for
# that version.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
