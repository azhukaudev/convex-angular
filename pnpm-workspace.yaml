# Force a single @better-fetch/fetch copy. better-auth pins 1.3.1 exactly while
# @convex-dev/better-auth resolves ^1.1.18 independently; two copies produce
# incompatible BetterFetch type identities and break the better-auth client
# plugin types (crossDomainClient/convexClient) during the Angular build.
# The docs site owns its own manifest so Astro's toolchain (Vite 8) resolves
# independently of the Angular build (Vite 7.3.6, pinned exactly by
# @angular/build). The root manifest stays the workspace root; overrides,
# allowBuilds, and release-age settings below remain workspace-wide.
packages:
  - apps/docs
overrides:
  '@better-fetch/fetch': 1.3.1
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  less: false
  lmdb: true
  msgpackr-extract: true
  nx: true
  # Astro declares sharp as an optional dependency for image optimization.
  # The docs site configures Astro's passthrough image service instead, so
  # sharp is never loaded and its native install script stays denied.
  sharp: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - jscpd@5.0.6
  - '@angular/cdk@21.2.14'
  - '@better-auth/core@1.6.22'
  - '@better-auth/drizzle-adapter@1.6.22'
  - '@better-auth/kysely-adapter@1.6.22'
  - '@better-auth/memory-adapter@1.6.22'
  - '@better-auth/mongo-adapter@1.6.22'
  - '@better-auth/prisma-adapter@1.6.22'
  - '@better-auth/telemetry@1.6.22'
  - better-auth@1.6.22
  - convex@1.41.0
  - jest-preset-angular@17.0.0
  - '@better-fetch/fetch@1.3.1'
  - '@convex-dev/better-auth@0.12.5'
  - '@swc/core-darwin-arm64@1.15.41'
  - '@swc/core-darwin-x64@1.15.41'
  - '@swc/core-linux-arm-gnueabihf@1.15.41'
  - '@swc/core-linux-arm64-gnu@1.15.41'
  - '@swc/core-linux-arm64-musl@1.15.41'
  - '@swc/core-linux-ppc64-gnu@1.15.41'
  - '@swc/core-linux-s390x-gnu@1.15.41'
  - '@swc/core-linux-x64-gnu@1.15.41'
  - '@swc/core-linux-x64-musl@1.15.41'
  - '@swc/core-win32-arm64-msvc@1.15.41'
  - '@swc/core-win32-ia32-msvc@1.15.41'
  - '@swc/core-win32-x64-msvc@1.15.41'
  - '@swc/core@1.15.41'
